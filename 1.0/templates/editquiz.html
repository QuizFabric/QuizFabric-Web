<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QuizFabric - Edit Quiz</title>
    <link rel="icon" href="/data/icon.png" type="image/png">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <link rel="apple-touch-icon" href="/data/icon.png">
    <meta name="theme-color" content="#4f46e5">
    <meta name="description" content="A modern quiz application for creating and taking quizzes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="QuizFabric">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .app-icon {
            position: fixed;
            top: 10px;
            right: 10px;
            height: 40px;
            width: 40px;
            z-index: 1000;
            opacity: 0.9;
        }
        .editquiz-container {
            max-width: 800px;
            margin: 20px auto;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: 0 10px 30px rgba(40, 8, 60, 0.35);
        }
        h1 {
            color: #fff;
            text-align: center;
            text-shadow: 0 2px 8px rgba(40, 8, 60, 0.6);
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .question-type {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .question-type label {
            display: inline;
            font-weight: normal;
        }
        .answers-section {
            margin-left: 20px;
        }
        .answer-input {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .answer-input input[type="text"] {
            flex: 1;
            margin-right: 10px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .btn-danger {
            background-color: #dc3545;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .btn-success {
            background-color: #28a745;
        }
        .btn-success:hover {
            background-color: #218838;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #212529;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .question-list {
            margin-top: 20px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            padding: 10px;
            background: rgba(255, 255, 255, 0.18);
            border-radius: 12px;
        }
        .question-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
        }
        .question-item:last-child {
            border-bottom: none;
        }
        .legacy-btn {
            background: #6c757d;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        @media (max-width: 768px) {
            .editquiz-container {
                margin: 10px;
                padding: 15px;
            }
            .question-item {
                flex-direction: column;
                align-items: flex-start;
            }
            .question-item div {
                margin-bottom: 5px;
            }
        }
            .image-preview {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
                margin-top: 15px;
            }
            .image-preview-item {
                position: relative;
                border: 2px solid #ddd;
                border-radius: 4px;
                overflow: hidden;
                background: white;
            }
            .image-preview-item img {
                width: 100%;
                height: 150px;
                object-fit: cover;
            }
            .image-preview-item .remove-btn {
                position: absolute;
                top: 5px;
                right: 5px;
                background: red;
                color: white;
                border: none;
                border-radius: 50%;
                width: 25px;
                height: 25px;
                cursor: pointer;
                font-size: 14px;
            }
            .image-preview-item .remove-btn:hover {
                background: darkred;
            }
            .upload-status {
                margin-top: 10px;
                padding: 10px;
                border-radius: 4px;
                display: none;
                margin-bottom: 10px;
            }
            .upload-status.success {
                background-color: #d4edda;
                color: #155724;
                display: block;
            }
            .upload-status.error {
                background-color: #f8d7da;
                color: #721c24;
                display: block;
            }
    </style>
</head>
<body>
<img src="/data/icon.png" alt="QuizFabric" class="app-icon">
    <div class="editquiz-container">
        <h1>QuizFabric - Edit: <span id="quiz-name-display"></span></h1>
        {% if message %}
        <p style="color: green; text-align: center;">{{ message }}</p>
        {% endif %}

            <div class="image-upload-section">
                <h3>📸 Quiz Images</h3>
                <p style="color: rgba(255, 255, 255, 0.75); margin: 10px 0;">Supported formats: PNG, WebP, JPG, JPEG | Max file size: 300MB | Max 20 images per quiz</p>
                <input type="file" id="image-input" accept=".png,.webp,.jpg,.jpeg" multiple>
                <button type="button" onclick="uploadImageForCurrentQuestion()" class="btn btn-primary" style="margin-top: 10px;">Upload Images For Current Question</button>
                <div style="margin-top: 10px;">
                    <input type="url" id="image-url-input" placeholder="Or paste an image URL (https://...)" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; margin-bottom: 5px;">
                    <button type="button" onclick="uploadImageFromUrl()" class="btn btn-primary">Add Image From URL</button>
                </div>
                <div id="upload-status" class="upload-status"></div>
                <div id="image-preview" class="image-preview"></div>
            </div>

        <button type="button" class="legacy-btn" onclick="toggleEditor()">Switch to Legacy Text Editor</button>

        <form id="edit-form" method="POST" action="{{ url_for('edit_quiz', quiz_name=quiz_name) }}">
            <div style="margin-bottom: 15px;">
                <label for="new_quiz_name" style="font-weight: bold;">Rename Quiz (leave blank to keep current name):</label>
                <input type="text" id="new_quiz_name" placeholder="New quiz name" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box;">
            </div>

            <div id="modern-editor">
                <div id="question-section">
                    <h3>Add/Edit Question</h3>
                    <div class="form-group">
                        <label for="question">Question:</label>
                        <input type="text" id="question" placeholder="Enter your question">
                    </div>

                    <div class="form-group">
                        <label>Question Type:</label>
                        <div class="question-type">
                            <label><input type="radio" name="qtype" value="mc" checked> Multiple Choice</label>
                            <label><input type="radio" name="qtype" value="typein"> Type-in Answer</label>
                            <label><input type="radio" name="qtype" value="slider"> Slider</label>
                            <label><input type="radio" name="qtype" value="puzzle"> Puzzle (Ordering)</label>
                        </div>
                    </div>

                    <div id="mc-options" class="form-group">
                        <label>Answers (select the correct one):</label>
                        <div class="answers-section" id="answers-container">
                            <div class="answer-input">
                                <input type="text" class="answer" placeholder="Answer 1">
                                <input type="radio" name="correct" value="0">
                            </div>
                            <div class="answer-input">
                                <input type="text" class="answer" placeholder="Answer 2">
                                <input type="radio" name="correct" value="1">
                            </div>
                            <div class="answer-input">
                                <input type="text" class="answer" placeholder="Answer 3">
                                <input type="radio" name="correct" value="2">
                            </div>
                            <div class="answer-input">
                                <input type="text" class="answer" placeholder="Answer 4">
                                <input type="radio" name="correct" value="3">
                            </div>
                        </div>
                        <button type="button" class="btn btn-secondary" onclick="addAnswer()">➕ Add Answer</button>
                    </div>

                    <div id="typein-option" class="form-group" style="display: none;">
                        <label for="typein-answer">Correct Answer:</label>
                        <input type="text" id="typein-answer" placeholder="Enter the correct answer">
                    </div>

                    <div id="slider-option" class="form-group" style="display: none;">
                        <label>Slider Range:</label>
                        <div style="display:flex; gap:10px; flex-wrap:wrap;">
                            <input type="number" id="slider-min" placeholder="Min" step="any" style="flex:1; min-width:100px;">
                            <input type="number" id="slider-max" placeholder="Max" step="any" style="flex:1; min-width:100px;">
                            <input type="number" id="slider-answer" placeholder="Correct answer" step="any" style="flex:1; min-width:100px;">
                            <input type="number" id="slider-tolerance" placeholder="Tolerance (optional)" step="any" style="flex:1; min-width:100px;">
                        </div>
                    </div>

                    <div id="puzzle-option" class="form-group" style="display: none;">
                        <label for="puzzle-answers">Answers in the correct order (one per line):</label>
                        <textarea id="puzzle-answers" rows="4" placeholder="First step&#10;Second step&#10;Third step"></textarea>
                    </div>

                    <button type="button" class="btn" id="add-btn" onclick="addQuestion()">Add Question</button>
                </div>

                <div class="question-list">
                    <h3>Questions:</h3>
                    <div id="questions-container"></div>
                </div>

                <input type="hidden" name="quiz_content" id="quiz_content">
                <input type="hidden" name="new_quiz_name" id="form_new_quiz_name">
                <input type="hidden" name="use_legacy" id="use_legacy" value="false">

                <br>
                <button type="submit" class="btn btn-success" id="save-btn">Save Quiz</button>
            </div>

            <!-- Legacy Text Editor -->
            <div id="legacy-editor" style="display: none;">
                <h3>Quiz Content (Text Format):</h3>
                <textarea id="legacy-content" name="legacy_content" style="width: 100%; height: 400px; padding: 10px; border: 1px solid #ddd; border-radius: 4px; font-family: monospace;"></textarea>
                <br><br>
                <button type="submit" class="btn btn-success" id="save-legacy-btn">Save Quiz</button>
            </div>

        </form>

        <br>
        <a href="{{ url_for('home') }}" class="btn">Back to Home</a>
    </div>

    <script>
        let questions = [];
        let editingIndex = -1;
        let usingLegacy = false;
            const quizNameDisplay = `{{ quiz_name | replace('\\', '\\\\') | replace('"', '\\"') }}`;
        
            document.getElementById('quiz-name-display').textContent = quizNameDisplay;

        function toggleEditor() {
            usingLegacy = !usingLegacy;
            const modernEditor = document.getElementById('modern-editor');
            const legacyEditor = document.getElementById('legacy-editor');
            const toggleBtn = document.querySelector('.legacy-btn');
            
            if (usingLegacy) {
                // Switch to legacy editor
                modernEditor.style.display = 'none';
                legacyEditor.style.display = 'block';
                toggleBtn.textContent = 'Switch to Modern Editor';
                
                // Get current quiz content from modern editor
                const currentContent = document.getElementById('quiz_content').value;
                document.getElementById('legacy-content').value = currentContent;
                document.getElementById('use_legacy').value = 'true';
            } else {
                // Switch to modern editor
                modernEditor.style.display = 'block';
                legacyEditor.style.display = 'none';
                toggleBtn.textContent = 'Switch to Legacy Text Editor';
                
                // Get content from legacy editor and parse it
                const legacyContent = document.getElementById('legacy-content').value;
                parseQuizContent(legacyContent);
                document.getElementById('use_legacy').value = 'false';
            }
        }

        // Handle form submission to include rename
        document.getElementById('edit-form').addEventListener('submit', function(e) {
            const newName = document.getElementById('new_quiz_name').value.trim();
            if (newName) {
                document.getElementById('form_new_quiz_name').value = newName;
            }
            
            if (!usingLegacy) {
                // Modern editor: quiz_content is already set
            } else {
                // Legacy editor: copy legacy content to quiz_content
                document.getElementById('quiz_content').value = document.getElementById('legacy-content').value;
            }
        });

        // Parse initial quiz_content - try JSON first, otherwise treat as legacy and preserve blank lines
        function parseQuizContent(content) {
            if (!content) {
                questions = [];
                updateQuestionsList();
                return;
            }
            // Try JSON (modern editor format)
            try {
                const parsed = JSON.parse(content);
                if (Array.isArray(parsed)) {
                    questions = parsed;
                    updateQuestionsList();
                    usingLegacy = false;
                    document.getElementById('modern-editor').style.display = 'block';
                    document.getElementById('legacy-editor').style.display = 'none';
                    document.getElementById('use_legacy').value = 'false';
                    return;
                }
            } catch (e) {
                // not JSON, fall through to legacy
            }

            // Legacy text: preserve content as-is in legacy textarea but DO NOT auto-switch editors.
            // Load legacy content into the textarea so user can toggle to it manually if desired.
            document.getElementById('legacy-content').value = content;
            // Ensure we keep modern editor visible by default
            document.getElementById('modern-editor').style.display = 'block';
            document.getElementById('legacy-editor').style.display = 'none';
            document.getElementById('use_legacy').value = 'false';

            // The QuizFabric server format: blocks separated by blank lines,
            // alternating question block / answers block. Parse it that way.
            const blocks = content.split(/\n\s*\n+/).map(b => b.trim()).filter(b => b);
            const parsedQuestions = [];
            for (let bi = 0; bi + 1 < blocks.length; bi += 2) {
                const question = blocks[bi];
                const answerLines = blocks[bi + 1].split('\n')
                    .map(l => l.trim()).filter(l => l);
                if (!question || !answerLines.length) continue;

                // Tagged question types: [SLIDER] and [PUZZLE]
                if (question.startsWith('[SLIDER]')) {
                    const qText = question.substring(8).trim();
                    const min = parseFloat(answerLines[0]);
                    const max = parseFloat(answerLines[1]);
                    let answer = null;
                    let tolerance = 0;
                    for (const line of answerLines) {
                        if (line.startsWith('*')) answer = parseFloat(line.substring(1).trim());
                        if (line.startsWith('~')) tolerance = parseFloat(line.substring(1).trim());
                    }
                    if (qText && !isNaN(min) && !isNaN(max) && answer !== null) {
                        parsedQuestions.push({question: qText, answers: [], correctIndex: -1, type: 'slider', min, max, answer, tolerance: tolerance || 0});
                    }
                    continue;
                }
                if (question.startsWith('[PUZZLE]')) {
                    const qText = question.substring(8).trim();
                    if (qText && answerLines.length >= 2) {
                        parsedQuestions.push({question: qText, answers: answerLines, correctIndex: -1, type: 'puzzle'});
                    }
                    continue;
                }

                const answers = [];
                let correctIndex = -1;
                let type = 'typein';
                for (const line of answerLines) {
                    if (line.startsWith('*')) {
                        answers.push(line.substring(1).trim());
                        correctIndex = answers.length - 1;
                        type = 'mc';
                    } else {
                        answers.push(line);
                    }
                }
                if (type === 'mc' && answers.length >= 2) {
                    parsedQuestions.push({question, answers, correctIndex, type});
                } else if (type === 'typein' && answers.length === 1) {
                    parsedQuestions.push({question, answers, correctIndex: 0, type});
                }
            }
            if (parsedQuestions.length) {
                // Populate a best-effort modern preview but keep legacy editor content intact
                questions = parsedQuestions;
                updateQuestionsList();
            } else {
                questions = [];
                updateQuestionsList();
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            {% autoescape false %}
            const initialContent = `{{ quiz_content | replace('\\', '\\\\') | replace('`', '\\`') | replace('${', '\\${') }}`;
            {% endautoescape %}
            parseQuizContent(initialContent);

            document.querySelectorAll('input[name="qtype"]').forEach(radio => {
                radio.addEventListener('change', function() {
                    const type = this.value;
                    document.getElementById('mc-options').style.display = type === 'mc' ? 'block' : 'none';
                    document.getElementById('typein-option').style.display = type === 'typein' ? 'block' : 'none';
                    document.getElementById('slider-option').style.display = type === 'slider' ? 'block' : 'none';
                    document.getElementById('puzzle-option').style.display = type === 'puzzle' ? 'block' : 'none';
                });
            });
        });

        function addQuestion() {
            const question = document.getElementById('question').value.trim();
            const qtype = document.querySelector('input[name="qtype"]:checked').value;
            let answers = [];
            let correctIndex = -1;
            let sliderMin = null, sliderMax = null, sliderAnswer = null, sliderTolerance = 0;

            if (qtype === 'mc') {
                answers = Array.from(document.querySelectorAll('.answer')).map(input => input.value.trim()).filter(val => val);
                const correctRadio = document.querySelector('input[name="correct"]:checked');
                if (correctRadio) correctIndex = parseInt(correctRadio.value);
                if (answers.length < 2 || correctIndex === -1 || correctIndex >= answers.length) {
                    alert('Please enter at least 2 answers and select the correct one.');
                    return;
                }
            } else if (qtype === 'slider') {
                sliderMin = parseFloat(document.getElementById('slider-min').value);
                sliderMax = parseFloat(document.getElementById('slider-max').value);
                sliderAnswer = parseFloat(document.getElementById('slider-answer').value);
                sliderTolerance = parseFloat(document.getElementById('slider-tolerance').value);
                if (isNaN(sliderMin) || isNaN(sliderMax) || isNaN(sliderAnswer)) {
                    alert('Please enter a minimum, maximum, and correct answer for the slider.');
                    return;
                }
            } else if (qtype === 'puzzle') {
                answers = document.getElementById('puzzle-answers').value.split('\n').map(s => s.trim()).filter(s => s);
                if (answers.length < 2) {
                    alert('Please enter at least 2 answers in the correct order.');
                    return;
                }
            } else {
                const answer = document.getElementById('typein-answer').value.trim();
                if (!answer) {
                    alert('Please enter the correct answer.');
                    return;
                }
                answers = [answer];
                correctIndex = 0;
            }

            if (!question) {
                alert('Please enter a question.');
                return;
            }

            const qobj = {question, answers, correctIndex, type: qtype};
            if (qtype === 'slider') {
                qobj.min = sliderMin;
                qobj.max = sliderMax;
                qobj.answer = sliderAnswer;
                qobj.tolerance = isNaN(sliderTolerance) ? 0 : sliderTolerance;
            }
            if (editingIndex >= 0) {
                questions[editingIndex] = qobj;
                editingIndex = -1;
                document.getElementById('add-btn').textContent = 'Add Question';
            } else {
                questions.push(qobj);
            }
            updateQuestionsList();
            resetForm();
        }

        function resetForm() {
            document.getElementById('question').value = '';
            document.querySelectorAll('.answer').forEach(input => input.value = '');
            document.querySelectorAll('input[name="correct"]').forEach(radio => radio.checked = false);
            document.getElementById('typein-answer').value = '';
            document.getElementById('slider-min').value = '';
            document.getElementById('slider-max').value = '';
            document.getElementById('slider-answer').value = '';
            document.getElementById('slider-tolerance').value = '';
            document.getElementById('puzzle-answers').value = '';
        }

        function updateQuestionsList() {
            const container = document.getElementById('questions-container');
            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const div = document.createElement('div');
                div.className = 'question-item';
                let answersText;
                if (q.type === 'mc') {
                    answersText = q.answers.map((a, i) => i === q.correctIndex ? `*${a}` : a).join(', ');
                } else if (q.type === 'slider') {
                    answersText = `${q.answer} (range ${q.min}–${q.max}${q.tolerance ? `, ±${q.tolerance}` : ''})`;
                } else if (q.type === 'puzzle') {
                    answersText = q.answers.join(' → ');
                } else {
                    answersText = q.answers[0];
                }
                div.innerHTML = `
                    <div>
                        <strong>Q${idx+1} (${q.type}):</strong> ${q.question}<br>
                        <strong>A:</strong> ${answersText}
                    </div>
                    <div>
                        <button type="button" class="btn btn-warning" onclick="editQuestion(${idx})">Edit</button>
                        <button type="button" class="btn btn-danger" onclick="removeQuestion(${idx})">Remove</button>
                    </div>
                `;
                container.appendChild(div);
            });
            // (image select removed; uploads attach to current question)
            // Convert to text format
            let text = '';
            questions.forEach(q => {
                if (q.type === 'slider') {
                    text += '[SLIDER]' + q.question + '\n\n';
                    text += q.min + '\n' + q.max + '\n*' + q.answer + '\n';
                    if (q.tolerance) text += '~' + q.tolerance + '\n';
                    text += '\n';
                    return;
                }
                if (q.type === 'puzzle') {
                    text += '[PUZZLE]' + q.question + '\n\n';
                    q.answers.forEach(ans => {
                        text += ans + '\n';
                    });
                    text += '\n';
                    return;
                }
                text += q.question + '\n\n';
                if (q.type === 'mc') {
                    q.answers.forEach((ans, i) => {
                        text += (i === q.correctIndex ? '*' : '') + ans + '\n';
                    });
                } else {
                    text += q.answers[0] + '\n';
                }
                text += '\n';
            });
            document.getElementById('quiz_content').value = text.trim();
        }

        function editQuestion(idx) {
            const q = questions[idx];
            document.getElementById('question').value = q.question;
            document.getElementById('mc-options').style.display = 'none';
            document.getElementById('typein-option').style.display = 'none';
            document.getElementById('slider-option').style.display = 'none';
            document.getElementById('puzzle-option').style.display = 'none';
            if (q.type === 'mc') {
                document.querySelector('input[name="qtype"][value="mc"]').checked = true;
                document.getElementById('mc-options').style.display = 'block';
                const container = document.getElementById('answers-container');
                container.innerHTML = '';
                q.answers.forEach((ans, i) => {
                    const div = document.createElement('div');
                    div.className = 'answer-input';
                    div.innerHTML = `
                        <input type="text" class="answer" placeholder="Answer ${i + 1}" value="${ans}">
                        <input type="radio" name="correct" value="${i}" ${i === q.correctIndex ? 'checked' : ''}>
                    `;
                    container.appendChild(div);
                });
            } else if (q.type === 'slider') {
                document.querySelector('input[name="qtype"][value="slider"]').checked = true;
                document.getElementById('slider-option').style.display = 'block';
                document.getElementById('slider-min').value = q.min;
                document.getElementById('slider-max').value = q.max;
                document.getElementById('slider-answer').value = q.answer;
                document.getElementById('slider-tolerance').value = q.tolerance || '';
            } else if (q.type === 'puzzle') {
                document.querySelector('input[name="qtype"][value="puzzle"]').checked = true;
                document.getElementById('puzzle-option').style.display = 'block';
                document.getElementById('puzzle-answers').value = q.answers.join('\n');
            } else {
                document.querySelector('input[name="qtype"][value="typein"]').checked = true;
                document.getElementById('typein-option').style.display = 'block';
                document.getElementById('typein-answer').value = q.answers[0];
            }
            editingIndex = idx;
            document.getElementById('add-btn').textContent = 'Update Question';
        }

        function removeQuestion(idx) {
            questions.splice(idx, 1);
            updateQuestionsList();
            if (editingIndex === idx) {
                editingIndex = -1;
                document.getElementById('add-btn').textContent = 'Add Question';
                resetForm();
            } else if (editingIndex > idx) {
                editingIndex--;
            }
        }

        function addAnswer() {
            const container = document.getElementById('answers-container');
            const answerCount = container.querySelectorAll('.answer-input').length;
            const div = document.createElement('div');
            div.className = 'answer-input';
            div.innerHTML = `
                <input type="text" class="answer" placeholder="Answer ${answerCount + 1}">
                <input type="radio" name="correct" value="${answerCount}">
            `;
            container.appendChild(div);
        }
        
            // (Old uploadImage removed; use uploadImageForCurrentQuestion instead)
        
            function addImagePreview(url, filename, questionIndex) {
                    const preview = document.getElementById('image-preview');
                    const div = document.createElement('div');
                    div.className = 'image-preview-item';
                    const meta = questionIndex !== undefined && questionIndex !== null ? `<div style="padding:6px; font-size:0.85em; color:#333;">Q${questionIndex+1}</div>` : '';
                    div.innerHTML = `
                        ${meta}
                        <img src="${url}" alt="${filename}">
                        <button type="button" class="remove-btn" onclick="this.parentElement.remove()">×</button>
                    `;
                    preview.appendChild(div);
                }
        
            function showStatus(message, type) {
                const statusDiv = document.getElementById('upload-status');
                statusDiv.textContent = message;
                statusDiv.className = `upload-status ${type}`;
                setTimeout(() => {
                    statusDiv.style.display = 'none';
                }, 4000);
            }

            // Upload files for the current question (or next question when adding)
            async function uploadImageForCurrentQuestion() {
                const fileInput = document.getElementById('image-input');
                if (!fileInput.files.length) {
                    showStatus('Please select at least one image file', 'error');
                    return;
                }

                // Determine target question index: editingIndex if editing, otherwise next index (when adding)
                const targetIndex = (typeof editingIndex === 'number' && editingIndex >= 0) ? editingIndex : questions.length;

                for (const file of fileInput.files) {
                    const formData = new FormData();
                    formData.append('image', file);
                    formData.append('question_index', String(targetIndex));

                    try {
                        const response = await fetch(`/upload_quiz_image/${encodeURIComponent(quizNameDisplay)}`, {
                            method: 'POST',
                            body: formData
                        });
                        let data = null;
                        try {
                            data = await response.json();
                        } catch (err) {
                            console.error('Non-JSON upload response:', response.status);
                            showStatus(`✗ Error uploading ${file.name}: HTTP ${response.status} - see console`, 'error');
                            continue;
                        }
                        if (response.ok) {
                            showStatus(`✓ Uploaded: ${file.name}`, 'success');
                            addImagePreview(data.url, file.name, targetIndex);
                        } else {
                            const errMsg = data && data.error ? data.error : JSON.stringify(data);
                            showStatus(`✗ Error uploading ${file.name}: ${errMsg}`, 'error');
                        }
                    } catch (error) {
                        showStatus(`✗ Error uploading ${file.name}: ${error.message}`, 'error');
                    }
                }

                fileInput.value = '';
            }

            // Download an image from a pasted URL for the current question
            async function uploadImageFromUrl() {
                const urlInput = document.getElementById('image-url-input');
                const imageUrl = urlInput.value.trim();

                if (!imageUrl) {
                    showStatus('Please enter an image URL', 'error');
                    return;
                }

                const targetIndex = (typeof editingIndex === 'number' && editingIndex >= 0) ? editingIndex : questions.length;

                try {
                    const response = await fetch(`/upload_quiz_image_url/${encodeURIComponent(quizNameDisplay)}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image_url: imageUrl, question_index: String(targetIndex) })
                    });
                    const data = await response.json();
                    if (response.ok) {
                        showStatus(`✓ Added from URL: ${data.filename}`, 'success');
                        addImagePreview(data.url, data.filename, targetIndex);
                    } else {
                        const errMsg = data && data.error ? data.error : JSON.stringify(data);
                        showStatus(`✗ Error adding from URL: ${errMsg}`, 'error');
                    }
                } catch (error) {
                    showStatus(`✗ Error adding from URL: ${error.message}`, 'error');
                }

                urlInput.value = '';
            }

            // Load existing images on page load
            document.addEventListener('DOMContentLoaded', function() {
                loadExistingImages();
            });
        
            function loadExistingImages() {
                const imageDir = `/UploadedImages/${encodeURIComponent(quizNameDisplay)}/`;
                // Note: This would require a backend endpoint to list images
                // For now, we'll leave the preview empty and let users upload new images
            }
    </script>
